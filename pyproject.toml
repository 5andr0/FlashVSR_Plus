[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashvsr-plus"
version = "0.1.0"
description = "Inference pipeline for FlashVSR+ video super-resolution"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"

# Runtime dependencies are intentionally installed from requirements.txt. In
# particular, this package does not replace a user's existing PyTorch/CUDA
# installation when installed by a host application such as ComfyUI.
dependencies = []

[tool.setuptools.packages.find]
include = ["inference*", "model_io*", "models*", "flashvsr_plus*"]

[tool.setuptools.package-data]
flashvsr_plus = ["py.typed"]
